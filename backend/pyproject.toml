[project]
name = "ocp-video-ingest"
version = "0.1.0"
description = "Pull Open Compute Project YouTube videos with yt-dlp and store them in S3"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "boto3[crt]>=1.38.0",
    "yt-dlp[default]>=2025.1.1",
    "openpyxl>=3.1.0",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.16.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
